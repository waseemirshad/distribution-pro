<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Distribution Pro — Wholesale &amp; FMCG Distribution ERP</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%234f46e5'/><text y='70' x='50' font-size='54' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'>DP</text></svg>">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>

<!-- ================= LOGIN ================= -->
<div id="login-screen" class="login-wrap">
  <div class="login-card">
    <div class="login-brand">
      <div class="logo">DP</div>
      <div>
        <h1>Distribution Pro</h1>
        <p>Wholesale &amp; FMCG Distribution ERP</p>
      </div>
    </div>
    <form id="login-form" autocomplete="off">
      <label>Username</label>
      <input id="login-user" name="username" placeholder="admin" autocomplete="username" required>
      <label>Password</label>
      <input id="login-pass" name="password" type="password" placeholder="admin123" autocomplete="current-password" required>
      <button class="btn primary block" type="submit" id="login-btn">Login karein</button>
      <div id="login-error" class="login-error"></div>
    </form>
    <details class="login-users">
      <summary>Pehli dafa ke login users (click karein)</summary>
      <div class="login-user-grid" id="login-user-grid"></div>
    </details>
    <div class="login-foot">
      <span id="server-info">…</span>
    </div>
  </div>
</div>

<!-- ================= APP SHELL ================= -->
<div id="app" class="app hidden">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-head">
      <div class="logo sm">DP</div>
      <div class="sidebar-title">
        <strong id="brand-name">Distribution Pro</strong>
        <span id="brand-tag">Wholesale ERP</span>
      </div>
      <button class="icon-btn only-mobile" id="close-nav" title="Band karein">✕</button>
    </div>
    <div class="sidebar-search">
      <input id="menu-search" placeholder="Menu dhundein… (Ctrl+K)">
    </div>
    <nav id="nav" class="nav"></nav>
    <div class="sidebar-foot">
      <div class="mini" id="gl-status">GL: —</div>
      <div class="mini" id="app-version">v1.0.0</div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <button class="icon-btn only-mobile" id="open-nav">☰</button>
      <div class="page-title">
        <h2 id="page-title">Dashboard</h2>
        <span id="page-sub"></span>
      </div>
      <div class="topbar-actions">
        <select id="warehouse-picker" class="mini-select" title="Godown"></select>
        <button class="btn ghost" id="btn-alerts" title="Alerts">🔔 <span id="alert-count" class="badge-dot hidden"></span></button>
        <button class="btn ghost" id="btn-quick-sale" title="Naya bill (F2)">🧾 Naya Bill</button>
        <button class="btn ghost" id="btn-theme" title="Theme">🌓</button>
        <div class="user-chip" id="user-chip">
          <span class="avatar" id="user-avatar">A</span>
          <div>
            <strong id="user-name">—</strong>
            <small id="user-role">—</small>
          </div>
        </div>
        <div class="user-menu hidden" id="user-menu">
          <button id="menu-profile">Mera profile / password</button>
          <button id="menu-shortcuts">Keyboard shortcuts (F1)</button>
          <button id="menu-recalc">Hisab recalculate karein</button>
          <button id="menu-logout" class="danger">Logout</button>
        </div>
      </div>
    </header>

    <div id="alert-bar" class="alert-bar hidden"></div>
    <section id="view" class="view"></section>
  </main>
</div>

<!-- ================= SHARED UI ================= -->
<div id="modal-root"></div>
<div id="toast-root" class="toast-root"></div>
<iframe id="print-frame" class="print-frame" title="print"></iframe>

<script src="/js/core.js"></script>
<script src="/js/pages/dashboard.js"></script>
<script src="/js/pages/pos.js"></script>
<script src="/js/pages/sales.js"></script>
<script src="/js/pages/purchases.js"></script>
<script src="/js/pages/inventory.js"></script>
<script src="/js/pages/money.js"></script>
<script src="/js/pages/people.js"></script>
<script src="/js/pages/reports.js"></script>
<script src="/js/pages/masters.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
